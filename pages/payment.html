<!DOCTYPE html>
<head>
    <link href="/css/payment.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<body>
    <div class="tittle">
        <h1>Payment Page</h1>
    </div>
    

        <div class="container">
            <div class="left">
                <h2>BILLING INFORMATION</h2>
                <form>
                <label for="firstname">First Name :</label>
                <input type="text" name="" placeholder="Kristen" required/><br><br>
    
                <label for="lastname">Last Name :</label>
                <input type="text" name="" placeholder="Lane" required/><br><br>
        
                <label for="email"> Email Address :</label>
                <input type="text" name="" placeholder="lalisa@gmail.com" required/><br><br>
                
                <label for="address">Address:</label>
                <input type="text" name="" placeholder="123,Jalan TARUC 11300 PENANG" required/><br><br>

                <label for="city">City :</label>
                <input type="text" name="" placeholder="Butterworth" required/><br><br>

                <div id="zipcode">
                    <label>
                    State
                    <select>
                        <option>Penang</option>
                        <option>Kuala Lumpur</option>
                        <option>Perak</option>
                        <option>Ipoh</option>
                        <option>Kedah</option>
                        <option>Johor</option>
                        <option>Sarawak</option>
                        <option>Sabah</option>
                    </select><br><br>
                </label>

                <label>
                    <label for="postcode">Postcode :</label>
                    <input type="text" name="" placeholder="11600" required/>
                </label>

                </div>
                   
            </form>
        </div>
                
   
                <div class="right">
                <h3>Payment Method</h3>

             <form>
                <label for="number">Credit Card Number :</label>
                <input type="text" name="" placeholder="Enter card number" required/><br><br>
    
                <label for="month">Exp Month :</label>
                <input type="text" name="" placeholder="Enter number" required/><br><br>
    
                <label for="number">Exp Year:</label>
                <input type="text" name="" placeholder="Enter card number" required/><br><br>
    
                <label for="number">CVV:</label>
                <select name="payment" id="type">
                    <option value="2023">2023</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                </select>

                <h3>Online bankings</h3>

                <input type="radio" name="onlinebanking"/>
                <label for="tng">Touch N' Go</label>
                <div>
                    <img id="img" src="" alt="tng"/>
                </div>
                <button type="button" onclick="show()" id="btnID">
                    Click Here To Scan
                </button>
                <script>
                    function show(){
                        document.getElementById('img').style.display="block";
                        document.getElementById('btnID').style.display="none";
                    }
                </script><br><br>

                <input type="radio" name="onlinebanking" name="grab"/>
                <label for="grab">Grab Pay </label>

                <input type="radio" name="onlinebanking" name="bank"/>
                <label for="bank">Bank Transfer ( Duit Now) </label><br><br>

                <button class="button button1">SUBMIT</button>
                
             </form>
        </div>
        </div>

       
    <script src="payment.js"></script>
</body>
