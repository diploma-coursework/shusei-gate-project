<head>
    <link rel="stylesheet" href="/css/signup.css"/>
</head>
<body>
    <div class="signup">
        <h1>Sign Up platform</h1>
    </div>

<hr>

<!--Create a signup platform-->
<form>
<div class="container">
    <p>Please fill up all the informations to create an account</p>

    <!--Username-->
    <label for="username"><b>Username:</b></label>
    <input type="text" placeholder="Enter your username" name="Username" required>

    <!--email-->
    <label for="email"><b>Email:</b></label>
    <input type="text" placeholder="Enter your email" name="email" required>

    <!--password-->
    <label for="password"><b>password:</b></label>
    <input type="password" placeholder="Enter your password" name="password" required>


    <!--A checkbox to remember user's password-->
    <label id="rem"><input type="checkbox" class="rememberchk" checked="checked" name="remember">Remember me</label>

    <!--Terms and Conditions-->                   
    <p>By creating an account you agree to our<iframe allowtransparency="true" src="/pages/terms&conditions.html" frameborder="0" style="width: 100%; height: 100px; border: none; color: dodgerblue;" scrolling="no"></iframe>Terms and conditions</p>

    <!--checkbox for agree of terms and conditions-->
    <label id="agr"><input type="checkbox" class="agreechk" checked="checked" name="agree">agree</label>

    <div>


        <!--Redirect user back to homepage-->
        <button type="button" class="cancelbutton" onclick="window.location.href ='index.html';">Cancel</button>

        <!--redirect user to userhomepage-->
        <button type="button" class="submitbutton"onclick="window.location.href ='          ';">Submit</button>

      

    </div>
  
</div>
</form>

   <script src="/js/signup.js"></script>
</body>
