<head>
  <link rel="stylesheet" href="/css/userNavbar.css" />
  <link rel="stylesheet" href="/css/profile.css" />
</head>
<body>
  <div class="navbar">
    <div class="user-greet">
      <h1>Hi, <span class="username"></span>.</h1>
    </div>
    <nav>
      <ul>
        <li
          data-page-redirect="#user-home"
          class="events-selection nav-selection"
        >
          Events
        </li>
        <li data-page-redirect="#cart" class="cart-selection nav-selection">
          Cart
        </li>
        <li data-page-redirect="#my-tickets" class="my-tickets nav-selection">
          My Tickets
        </li>
        <li
          data-page-redirect="#profile"
          class="profile-selection nav-selection selected"
        >
          Profile
        </li>
      </ul>
    </nav>
  </div>
  <script src="/js/userNavbar.js"></script>
  <script src="/js/userProfile.js"></script>
  <div class="profilePic">
    <div class="image">
     <img src="/assets/generic_user.png" alt="userProfile" />
    </div>
   <div class="input">
    <input type="file" name="image" id="imageUpload" onchange="uploadfile()">
    <div class="label">
     <label for="image">Select an image</label>
      <script type="Image_upload" src="/js/user_image.js"></script>
    </div>
   </div>
  </div>
  <div class="UserInfo">

    <table>
      <tr>
        <th>Username:</th>
        <th>:</th>
        <td><input type="text" placeholder=" Enter your username (maximum length 20) " maxlength="20" name="username" id="username2" width="230px" required checked/></td>
      </tr>
      <tr>
        <th id="displayEmail">Email</th>
        <th>:</th>
        <td><input type="email" placeholder="Example1234@gmail.com" maxlength="30" name="email" id="email2" required checked/></td>
      </tr>
      <tr>
        <th id="displayPassword">Password:</th>
        <th>:</th>
        <td><input type="password" placeholder="Enter your password" maxlength="10" name="password" id="user_Input" required checked/><input type="checkbox" onclick="showpassFunction()"/>Show password</input></td>
      </tr>
      <tr>
        <th id="displayDate">Member since</th>
        <th>:</th>
        <td></td>
      </tr>
      <tr>
        <th id="displayPoint">Accumulated</th>
        <th>:</th>
        <td></td>
      </tr>
      <tr>
        <th id="displayItemPurchased">Number of product purchased</th>
        <th>:</th>
        <td></td>
      </tr>
    </table>

   <script src="/js/userProfile.js"></script>

    <div class="textarea">
      <fieldset id="UserProfile" width="80%">
        <legend>About yourself</legend>
        <textarea id="aboutyourself" name="aboutyourself" placeholder="Type something to describe yourself (optional)"></textarea>
        <label for="aboutyourself">Let us know you better!</label>
    </fieldset>
    </div>

  </div>
  <div class="button">
  <route-to href="#user-home">
    <button class="back">Back</button>
   </route-to>
  <button type="submit" class="updateProfile" value="Update">Update profile</button> 
  </div>
  <script src="/js/togglePasswordVisi.js"></script>
</body>

<footer>

  </div>
</footer>
