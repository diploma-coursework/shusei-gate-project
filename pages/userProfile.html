<head>
  <link rel="stylesheet" href="/css/userNavbar.css" />
  <link rel="stylesheet" href="/css/profile.css" />
</head>
<body>
  <div class="navbar">
    <div class="user-greet">
      <img src="/assets/generic_user.png" alt="user profile picture" />
      <h1>Hi, <span class="username"></span>.</h1>
    </div>

    <nav>
      <ul>
        <li
          data-page-redirect="#user-home"
          class="events-selection nav-selection"
        >
          Events
        </li>
        <li data-page-redirect="#cart" class="cart-selection nav-selection">
          Cart
        </li>
        <li data-page-redirect="#my-tickets" class="my-tickets nav-selection">
          My Tickets
        </li>
        <li
          data-page-redirect="#profile"
          class="profile-selection nav-selection selected"
        >
          Profile
        </li>
      </ul>
    </nav>
  </div>
  <script src="/js/userNavbar.js"></script>
  <script src="/js/userProfile.js"></script>

  <div class="pbigbox">
    <p id="displayUsername"></p>
    <p id="displayEmail"></p>
    <p id="displayContact"></p>
    <p id="displayDate">Join Date:</p>
    <p id="displayPoints">Points Accumulated:</p>
    <p id="displayItemPurchased">No. Of Purchased:</p>
    <p id="Status">Status:</p>
  </div>
  <p>Check for offers!</p>
</body>
