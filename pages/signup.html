<head>
    <link rel="stylesheet" href="/css/signup.css" />
</head>
<body>
    <div id="idsignup" class="signup">
        <h1>Sign Up platform</h1>
        <hr />

        <!--Create a signup platform-->
        <form class="Information">
            <div class="container">
                <p class="form-error-msg">Please fill up all the informations to create an account</p>

                <!--Username-->
                <label for="username"><b>Username:</b></label>
                <input type="text" placeholder="Enter your username" name="username" required />

                <!--email-->
                <label for="email"><b>Email:</b></label>
                <input type="email" placeholder="Enter your email" name="email" required />

                <!--password-->
                <label for="password"><b>Password:</b></label>
                <input type="password" placeholder="Enter your password" name="password" required />

                <!--Terms and Conditions-->
                <p>
                    By creating an account you agree to our
                    <a href="https://www.example.com/shusei-gate-tnc" target="_blank" style="color: dodgerblue"
                        >Terms & Privacy
                    </a>
                    <!-- 
                        target black opens another tab instead of redirecting
                    -->
                </p>

                <!--checkbox for agree of terms and conditions-->
                <label id="agr"><input type="checkbox" class="agreechk" checked name="agree" />Agree</label>

                <div class="btn-container">
                    <!--Redirect user back to homepage-->
                    <route-to href="#"><button type="button" class="cancelbutton">Cancel</button></route-to>

                    <!--store user signup data and direct to homepage-->
                    <button type="submit" class="signupbutton">Sign Up</button>
                </div>
            </div>
        </form>
    </div>

    <script type="module" src="/js/signup.js"></script>
</body>
